; RumourEngine quest endings (ADR-001, "Quest endings").
;
; When one of the player's quests ends, the decision model reads its journal
; and judges whether word of how it ended would get out, and how far. Endings
; people would hear of become rumours where the player is. Errands and
; miscellaneous quests are never asked about, and nor are quests a save had
; finished before RumourEngine saw them end.
;
; A line here decides a quest instead:
;   EditorID = always       told, whatever the decision model says; it still
;                           judges how far the news goes, if there is one
;   EditorID = never        never told
;   EditorID = 0.8          told, at this notability (0 to 1), without asking
; EditorID:stage is one ending of a quest that has several, by the stage it
; ends on. Without a decision model, only the quests here that are told become
; rumours, at the "Notability without a decision model" setting unless the
; line gives one. A line can name a miscellaneous quest too, if it has a
; journal.
;
; Other mods add to this file without editing it: a file named
; <Name>_quests.ini in this folder is read after it, in file-name order. A line
; for the same key as an earlier file's replaces it, and a key with nothing
; after the = takes it away. The log names each file it reads. Comments go on
; lines of their own.

