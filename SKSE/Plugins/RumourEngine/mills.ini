; RumourEngine mills (ADR-001, "Mills").
;
; Other mods add to this file without editing it: a file named <Name>_mills.ini
; in this folder is read after it, the way SPID reads *_DISTR.ini. Patches are
; read in file-name order, and a line for the same key as an earlier file's
; replaces it ([Links]: the same two mills). A key with nothing after the =
; takes away an earlier file's line. The log names each file it reads, and
; each line that replaces another file's.
;
; [Lines] describes each mill to the retell prompt: who they are and what they
; care about, so each group's version of a rumour has its own slant. The part
; before the first colon or full stop is the group's name in the prompt.
; A mill not listed here is described by its kind ("Riverwood's townsfolk",
; "Markarth's guards"). Ids are as RumourEngine_Mills.json and the log name
; them; they come from location editor IDs, so mod-added places have their own.
;
; [Factions] makes a mill of a faction's named members, wherever they live:
;   id = Name: FactionEditorID, FactionEditorID
; for groups whose talk has its own slant but who don't live together. Members
; keep their town's mills too, and hear their faction's telling first. Named
; members with no place of their own (a legate on campaign) are in it alone.
; Members of a faction listed here count as people even if the faction is
; hostile to strangers. Factions are never made into mills automatically.
; The Thieves Guild, the College and the Dawnguard need no entry: they already
; have mills of their own (riften.underworld, winterholdcollege, hunterhq).
;
; [Links] adds a travel link between two mills that the map doesn't give, or
; changes one it gives:
;   a = b: kind, weight
; kind is road, carriage, ship or hold; the weight is optional (road 1, carriage
; 0.6, ship 0.5, hold 0.15, as the builder makes them). It replaces whatever
; link the builder made between the two, and "none" takes that link away.
; "ears" (weight 1) is one-way: a hears what is said in b, as an informant
; would, and nothing goes back along it. For a guild or faction the distance is
; from its nearest member's town.
; Hops along a link go at that kind's rate times the weight, and take the
; distance between the two places to cross. Mills linked by shared members
; (a guild and its town) can't be linked here. The log lists each link as it
; is made. Try one first with tools/spreadsim.py --link a=b:kind.
;
; [Secrecy] makes a mill keep what it hears:
;   id = 0.8
; It passes a rumour on only if someone in it gossips more readily than this
; (or than the rumour's own secrecy, if that is higher), and its members don't
; raise those rumours unprompted. Gossip ratings run from about 0.2 (a court
; wizard) to 0.9 (an innkeeper); most people are near 0.45. With ears, it
; lets a group hear widely and tell nobody. Try it with --mill-secrecy id=0.8.
;
; [Retell] says when a mill's own version of a rumour is written:
;   id = eager
; writes it as soon as the rumour arrives, wherever the player is. Otherwise
; ("lazy") it is written when the player comes to that place or someone there
; is about to tell it, and whoever asks first gets it a little later. For a mill
; another mod reads out in prompts of its own, such as faction leaders' turns.
; Each eager mill costs a retell call for most rumours that reach it. Everyone
; in an eager mill has also heard whatever reaches it as soon as it does; in
; other mills a rumour gets round over a day or two, gossips first.
;
; Later stages add sections to move people between mills and merge them.

[Lines]
; Whiterun Hold
whiterun.commons = Whiterun's townsfolk: market stallholders, the Bannered Mare's regulars, the Companions' neighbours. They love a scandal and distrust anyone from away.
whiterun.garrison = Whiterun's guards: bored men on the walls. They care about bandits, fights and who's armed, and tell everything with a crude laugh.
whiterun.court = Dragonsreach: the Jarl's household, steward and court wizard. They care about the war, dragons, and what anything means for the hold.
riverwood = Riverwood: a mill village on the road south of Whiterun. Woodcutters, a smith, a trader and an inn; they care about the road, bandits and whoever is passing through.
rorikstead = Rorikstead: a farming village on the western road. They care about harvests and travellers' tales, and are slow to believe city news.
highhrothgar = High Hrothgar: the Greybeards and their steward, high on the Throat of the World. They hear little, care less, and take everything as a sign of the Voice.

; The Rift
riften.commons = Riften's canal-side traders. They know the Black-Briars run things, are cynical about everyone, and love a swindle.
riften.underworld = The Ragged Flagon's crowd: thieves and fences. They care about money, marks and who's crossed whom, and admire a clever crook.
riften.garrison = Riften's guards: underpaid and half-bought. They care about bribes, trouble on the docks and whoever they can shake down.
riften.court = Mistveil Keep: Jarl Laila's household. They care about the Black-Briars' grip, the war, and keeping up appearances.
ivarstead = Ivarstead: a hamlet at the foot of the Throat of the World. Pilgrims, a mill and an inn; they care about the mountain, the Greybeards and strange visitors.
shorsstone = Shor's Stone: a mining hamlet in the autumn woods. A few miners and a smith who care about the mine, spiders and the road to Riften.
largashbur = Largashbur: an Orc stronghold under a curse. They care about strength, their chief and the god who has turned from them, and scorn soft outsiders.
merryfairfarm = Merryfair Farm: farmhands outside Riften. They care about the harvest, the weather and what the Black-Briars want next.
snowshodfarm = Snow-Shod Farm: farmhands outside Riften. They care about the harvest, prices at the market and gossip from town.

; Haafingar
solitude.commons = Solitude's townsfolk: Imperial-leaning traders, sailors and Bards College students. They like a good story and a fashionable outrage.
solitude.court = The Blue Palace: Jarl Elisif's court and General Tullius's officers. They care about the war, the Thalmor and the Empire's standing.
solitude.garrison = Solitude's Imperial guards. Disciplined, dutiful, dismissive of anything that sounds like Stormcloak talk.
dragonbridge = Dragon Bridge: a timber village by the old bridge and the Penitus Oculatus outpost. They care about the road, the river and the Emperor's men.
katlasfarm = Katla's Farm: farmers and stablehands below Solitude's walls. They care about horses, travellers and what the city folk are fussing over.
thalmorembassy = The Thalmor Embassy: Altmer agents and their servants. Cold and watchful, they care about Talos worshippers, dissent, and anything that could be used against someone.

; Eastmarch
windhelm.commons = Windhelm's Nord townsfolk. Proud, Stormcloak-loyal, wary of Dunmer and Argonians, and quick to blame outsiders.
windhelm.garrison = Windhelm's Stormcloak guards. They care about the war, the Empire's spies and anyone making trouble in the Grey Quarter.
windhelm.court = The Palace of the Kings: Ulfric's household and advisors. They care about the rebellion, the High King's crown and Imperial treachery.
kynesgrove = Kynesgrove: a small mining village by the river. Miners and an innkeeper; they care about the mine, dragons and the road to Windhelm.
darkwatercrossing = Darkwater Crossing: a riverside mining camp. Miners who care about the corundum seam, the river and refugees from the war.
gloomboundmine = Gloombound Mine: Orc miners near Mor Khazgur's kin. They care about the ore, their chief and anyone poking about their tunnels.
narzulbur = Narzulbur: an Orc stronghold among the mountains. They care about strength, the ebony mine and their own chief's word, and little for Nord politics.

; The Reach
markarth.commons = Markarth's townsfolk, under the Silver-Bloods' thumb. Suspicious and frightened of the Forsworn; they assume someone powerful is behind everything.
markarth.underworld = Cidhna Mine's prisoners. Bitter and conspiratorial; everything is a plot of the Silver-Bloods or the Nords.
markarth.garrison = Markarth's guards: the Silver-Bloods' men in all but name. They care about the Forsworn, order, and not asking who pays them.
markarth.court = Understone Keep: the Jarl's court and the Dwemer scholars below. They care about the Forsworn, the Silver-Bloods and the Thalmor's questions.
karthwasten = Karthwasten: a mining hamlet fought over by the Silver-Bloods and a band of sellswords. They care about the mine, the Forsworn and who owns what.
lefthandmine = Left Hand Mine: Kolskeggr's miners out in the Reach. They care about the ore, the Forsworn, and who's gone missing on the road.
dushnikhyal = Dushnikh Yal: an Orc stronghold in a pass of the Reach. They care about strength, their chief and the Forsworn, and judge every tale by who fought well.
morkhazgur = Mor Khazgur: an Orc stronghold in the western hills. They care about their chief, strong sons and daughters, and outsiders getting their due.

; Falkreath Hold
falkreath = Falkreath: a town of graveyards in the pine forest. Quiet, gloomy folk who care about death, the dead and the Jarl's drinking.

; Hjaalmarch
morthal = Morthal: a marsh town in the mist. Wary of strangers and of magic, quick to suspect witchcraft.
stonehills = Stonehills: a mining hamlet in the hills above the marsh. Miners who care about the seam, the cold, and whatever's lurking in the dark.

; The Pale
dawnstar = Dawnstar: a mining and fishing port on the north coast. Sailors and miners who care about the sea, ships, the East Empire Company and their bad dreams.
angasmill = Anga's Mill: woodcutters in the snowbound Pale. They care about timber, the cold, and whoever comes down the road from Dawnstar.
nightgateinnexterior = Nightgate Inn: a lonely inn on the road north of the Pale. Its few regulars care about travellers' tales, the cold and anything strange in the night.

; Winterhold
winterhold = Winterhold: the ruin of a town on the cliffs. Bitter Nords who blame the College for everything that ever went wrong.
winterholdcollege = The College of Winterhold's mages. Curious, aloof, and interested only in the magical side of any tale.
whistlingmine = Whistling Mine: a few miners in Winterhold's snowfields. They care about the mine, the cold, and whatever news reaches the north.

; Solstheim
ravenrock.commons = Raven Rock's Dunmer: miners and traders of the Redoran colony on Solstheim. Proud, put-upon, wary of Nords and of the Empire's forgetting them.
ravenrock.garrison = The Redoran Guard of Raven Rock. Dutiful and stern, they care about the ash, the mine and threats to the town.
skaalvillage = The Skaal: an old Nord people of Solstheim who keep to the All-Maker's ways. Suspicious of outsiders and of anything that smells of Hermaeus Mora.
thirskunifyingdummy = Thirsk Mead Hall: a band of Rieklings and Nord hunters in a mead hall on Solstheim. They care about the hunt, mead and their chief's glory.
telmithryn = Tel Mithryn: Master Neloth's mushroom tower and his long-suffering household. They care about Neloth's research and his moods, and little else.
stonewater = Stonewater: a handful of Dunmer of Solstheim. They care about the ash, the old ways and what the Redoran are up to.

; Dawnguard
hunterhq = Fort Dawnguard: vampire hunters in the Rift's mountains. They see vampires behind every disappearance and every sickness, and trust nobody pale.
vampirecastle = Castle Volkihar: an ancient vampire court on an island in the Sea of Ghosts. They care about blood, power, their lord's schemes and the Dawnguard's hunters.

; Faction mills ([Factions] below)
legion = The Imperial Legion's officers: Tullius's staff and the legates. They care about the war, discipline, supply and what the Stormcloaks will try next.
stormcloaks = Ulfric's Stormcloaks: his officers and sworn men. They care about the war, Talos, Nord pride and every Imperial or Thalmor insult.
thalmor = The Thalmor: the Aldmeri Dominion's agents in Skyrim. They care about Talos worshippers, dissent, and leverage over anyone who matters.
companions = The Companions of Jorrvaskr: warriors for hire. They care about honour, a good fight, and who's worth the coin; they scorn sneaks and mages.
darkbrotherhood = The Dark Brotherhood: assassins of the Sanctuary. They care about contracts, who wants whom dead, and staying unseen.
volkihar = The Volkihar clan: Lord Harkon's vampire court. They care about blood, power, the prophecy and the Dawnguard's hunters.

