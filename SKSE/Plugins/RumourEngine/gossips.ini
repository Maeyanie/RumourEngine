; RumourEngine gossip scores (ADR-001, "Gossip score").
;
; How much of a gossip each person is, from 0 (says nothing) to 1 (tells
; everyone everything). The score decides who starts tellings, how small a
; thing they'll pass on, how soon they hear what is going round, and how much
; they carry talk between the groups they belong to.
;
; Other mods add to this file without editing it: a file named
; <Name>_gossips.ini in this folder is read after it, in file-name order. A
; line for the same key as an earlier file's replaces it, and a key with
; nothing after the = takes it away. The log names each file it reads.
;
; A named person's score starts from their job. If SkyrimNet has a decision
; provider, their bio is then read once, and again whenever it changes: a bio
; that shows them talkative or close-mouthed moves the score up or down, and
; one that says nothing either way leaves it alone. Comments go on lines of
; their own.

[Jobs]
; FactionEditorID = score. Someone in several takes the highest. Everyone gets
; a small fixed nudge of their own, so not every innkeeper is the same.
; "default" is for people in none of them.
default = 0.45
JobInnkeeperFaction = 0.9
JobInnServer = 0.85
JobBardFaction = 0.85
FavorJobsBeggarsFaction = 0.8
FavorJobsDrunksFaction = 0.8
JobStreetVendorFaction = 0.75
JobMerchantFaction = 0.7
CarriageSystemFaction = 0.7
JobFenceFaction = 0.6
JobHostlerFaction = 0.6
JobStewardFaction = 0.5
JobJarlFaction = 0.4
IsGuardFaction = 0.3
JobHousecarlFaction = 0.25
JobCourtWizardFaction = 0.2

[People]
; Name = score, or an NPC's editor ID = score. This wins outright: their job
; and their bio are not looked at. A name covers everyone called that.
; Haelga = 0.9
